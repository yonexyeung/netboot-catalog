# NetBoot Catalog — nginx configuration
# Serves: boot assets (catalog entries) + iPXE menu via HTTP

server {
    listen 80 default_server;
    server_name _;

    # Serve catalog entries (kernel, initrd, squashfs)
    location /catalog/ {
        alias /srv/catalog/;
        autoindex on;
        sendfile on;
        tcp_nopush on;
    }

    # Serve iPXE menu and TFTP files via HTTP
    location /tftp/ {
        alias /srv/tftp/;
        autoindex on;
    }

    # Health check
    location /health {
        return 200 'ok';
        add_header Content-Type text/plain;
    }
}
