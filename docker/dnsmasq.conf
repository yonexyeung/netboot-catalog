# NetBoot Catalog — dnsmasq configuration
# ProxyDHCP mode: does NOT assign IPs, only provides PXE boot info.
# Works alongside your existing DHCP server (router, etc.)

# Disable DNS — we only need DHCP proxy + TFTP
port=0

# ProxyDHCP — respond to PXE requests on the local subnet
# __NBC_SUBNET__ is replaced by entrypoint.sh at startup
dhcp-range=__NBC_SUBNET__,proxy

# Detect iPXE clients via user-class
dhcp-userclass=set:ipxe,iPXE

# Detect architecture
dhcp-match=set:bios,option:client-arch,0
dhcp-match=set:efi64,option:client-arch,7
dhcp-match=set:efi64-2,option:client-arch,9

# If client IS iPXE → serve menu script via TFTP
# (proxyDHCP cannot send HTTP URLs — must use TFTP filename)
dhcp-boot=tag:ipxe,menu.ipxe

# If client is NOT iPXE → serve iPXE binary to chainload
# Legacy BIOS: serve undionly.kpxe via TFTP
dhcp-boot=tag:!ipxe,tag:bios,undionly.kpxe
# UEFI x86_64: serve ipxe.efi via TFTP
dhcp-boot=tag:!ipxe,tag:efi64,ipxe.efi
dhcp-boot=tag:!ipxe,tag:efi64-2,ipxe.efi

# TFTP server
enable-tftp
tftp-root=/srv/tftp

# Logging
log-dhcp
log-queries
