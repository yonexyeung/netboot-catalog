# NetBoot Catalog — dnsmasq configuration
# ProxyDHCP mode: does NOT assign IPs, only provides PXE boot info.
# Works alongside your existing DHCP server (router, etc.)

# ProxyDHCP on port 4011
dhcp-range=0.0.0.0,proxy

# PXE boot options
# Legacy BIOS
dhcp-match=set:bios,option:client-arch,0
dhcp-boot=tag:bios,undionly.kpxe

# UEFI x86_64
dhcp-match=set:efi64,option:client-arch,7
dhcp-boot=tag:efi64,ipxe.efi
dhcp-match=set:efi64-2,option:client-arch,9
dhcp-boot=tag:efi64-2,ipxe.efi

# iPXE user-class detection — serve menu directly via HTTP
# __NBC_SERVER_IP__ is replaced by entrypoint.sh at startup
dhcp-match=set:ipxe,175
dhcp-boot=tag:ipxe,http://__NBC_SERVER_IP__/tftp/menu.ipxe

# TFTP server
enable-tftp
tftp-root=/srv/tftp

# Logging
log-dhcp
log-queries
