schema_version: "1"
id: ubuntu-server
name: "Ubuntu Server Live Installer"
distribution: ubuntu
homepage: https://ubuntu.com/server
maintainer: community

# Ubuntu Server uses casper/ structure with layered squashfs.
# PXE boot requires serving the entire ISO via url= parameter.
# The original ISO is kept in the catalog entry for this purpose.
detection:
  - file_exists: casper/vmlinuz
  - file_exists: casper/initrd
  - file_contains:
      path: .disk/info
      pattern: "Ubuntu-Server"

assets:
  kernel: casper/vmlinuz
  initrd: casper/initrd
  rootfs: casper/ubuntu-server-minimal.squashfs
  rootfs_type: squashfs
  rootfs_optional: true
  # Keep the original ISO in the catalog entry (needed for url= boot method)
  keep_iso: true

boot:
  # url= fetches the entire ISO over HTTP for subiquity installer
  default: "ip=dhcp url={{base_url}}/{{iso_filename}} cloud-init=disabled"
  variants:
    autoinstall: 'ip=dhcp url={{base_url}}/{{iso_filename}} autoinstall ds=nocloud-net\;s={{base_url}}/autoinstall/'
    debug: "ip=dhcp url={{base_url}}/{{iso_filename}} cloud-init=disabled debug"

validation:
  required_files:
    - vmlinuz
    - initrd
