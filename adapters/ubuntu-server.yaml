schema_version: "1"
id: ubuntu-server
name: "Ubuntu Server Live Installer"
distribution: ubuntu
homepage: https://ubuntu.com/server
maintainer: community

# Ubuntu Server uses casper/ structure.
# PXE boot method: kernel+initrd from casper/, then fetch ISO via url= parameter.
# Unlike Desktop, Server typically serves the whole ISO rather than individual squashfs.
detection:
  - file_exists: casper/vmlinuz
  - file_exists: casper/initrd
  - file_contains:
      path: .disk/info
      pattern: "Ubuntu-Server"

assets:
  kernel: casper/vmlinuz
  initrd: casper/initrd
  # Server ISO uses layered squashfs — rootfs extraction is optional.
  # Boot primarily works by serving the entire ISO via url= parameter.
  # Set rootfs to the minimal layer if it exists, otherwise leave empty.
  rootfs: casper/ubuntu-server-minimal.squashfs
  rootfs_type: squashfs
  rootfs_optional: true

boot:
  # Primary method: serve entire ISO over HTTP, kernel fetches it via url=
  default: "ip=dhcp url={{base_url}}/ubuntu-server.iso cloud-init=disabled"
  variants:
    autoinstall: 'ip=dhcp url={{base_url}}/ubuntu-server.iso autoinstall ds=nocloud-net\;s={{base_url}}/autoinstall/'
    debug: "ip=dhcp url={{base_url}}/ubuntu-server.iso cloud-init=disabled debug"

validation:
  required_files:
    - vmlinuz
    - initrd
